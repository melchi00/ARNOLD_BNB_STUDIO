- question: What's the shortest booking you take?
  answer: "One hour. Most people book two to four — long enough to settle in without watching the clock."
- question: How does check-in and check-out work?
  answer: "We meet you at the door, hand over the keys and show you around in under five minutes. Check-out is the end of your slot; add Late checkout if you want an extra hour."
- question: How many people can come?
  answer: "Two guests are included. Up to four is fine with the Extra guest add-on at KES 200 each. It's a studio, not an event space — no parties."
- question: How do I pay?
  answer: "M-Pesa. Half up front to hold your slot, the balance when you arrive. We send the till details on WhatsApp once your time is confirmed."
- question: What if I need to cancel?
  answer: "Tell us more than 12 hours ahead and your deposit moves to another day. Under 12 hours, the deposit covers the slot we held for you."
- question: Is there parking?
  answer: "Yes — secure off-street parking for one car, free with any booking. Mention it when you book so we keep a space."
- question: Can I bring my own food and drinks?
  answer: "Absolutely. There's a kettle, glasses and a small fridge. Or add Snacks & drinks and we'll have it set out before you arrive."
- question: Can I shoot content here?
  answer: "Yes. Add Photographer access and you can bring lighting, move furniture and use the whole space. Just put it back before you leave."
